services:
  slides:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentic-ai-slides:latest
    container_name: agentic-ai-slides
    ports:
      - "${PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /tmp:uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
