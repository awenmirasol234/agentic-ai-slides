server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    image/svg+xml
    text/xml;

  # Lightweight container liveness endpoint
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Avoid noisy 404 logs when browsers probe /favicon.ico
  location = /favicon.ico {
    access_log off;
    log_not_found off;
    return 204;
  }

  # Cache static presentation assets briefly with ETag revalidation
  location ~* \.(css|js|svg|png|ico|webp|woff2?)$ {
    try_files $uri =404;
    include /etc/nginx/includes/security-headers.conf;
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
  }

  # Revalidate HTML entrypoints so updates reflect on reload
  location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/includes/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
}
